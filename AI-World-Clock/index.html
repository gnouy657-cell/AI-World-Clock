<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment-with-locales.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment-timezone/0.6.3/moment-timezone-with-data-1970-2030.min.js"></script>
    <title>AI World Clock</title>
  </head>
  <body>
    <div class="Frame">
      <h1>WORLD CLOCK</h1>
      <select id="city">
        <option value="">Choose a City....</option>
        <option value="America/Lansing 🌳">My location</option>
        <option value="Australia/Sydney">Sydney 🦘</option>
        <option value="Asia/Vientiane">Vientiane 🙏</option>
        <option value="America/New_York">New York 🗽</option>
        <option value="Europe/London">London 🎡</option>
      </select>

      <div id="world">
        <div class="cities" id="detroit">
          <div>
            <h2>Detroit 🚗</h2>
            <div class="date1"></div>
          </div>
          <div class="time1"></div>
        </div>
        <div class="cities" id="bangkok">
          <div>
            <h2>Bangkok 🐘</h2>
            <div class="date1"></div>
          </div>
          <div class="time1"></div>
        </div>
      </div>
    </div>

    <footer>
      This project was coded by
      <a href="https://github.com/gnouy657-cell" target="_blank">Brooke Thao</a>
      and is open sourced on
      <a href="https://github.com/gnouy657-cell/AI-World-Clock" target="_blank"
        >Github</a
      >
      and hosted by
      <a href="https://ai-world-clock.onrender.com" target="_blank">Render</a>.
    </footer>

    <script src="action.js"></script>
  </body>
</html>
