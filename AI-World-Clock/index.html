<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>AI World Clock</title>
  </head>
  <body>
    <div class="Frame">
      <h1>WORLD CLOCK</h1>
      <select>
        <option value="">Choose a City....</option>
        <option value="London">London</option>
        <option value="Vietanine">Vietanine</option>
        <option value="Detroit">Detroit</option>
        <option value="Washington D.C.">Washington D.C.</option>
      </select>

      <div class="cities">
        <div>
          <h2>San Franciso 🌉</h2>
          <div class="date1">August 16th 2026</div>
        </div>
        <div class="time1">
          3:48:20
          <small> PM </small>
        </div>
      </div>
      <div class="cities">
        <div>
          <h2>Bangkok 🐘</h2>
          <div class="date1">August 16th 2026</div>
        </div>
        <div class="time1">
          3:48:20
          <small> PM </small>
        </div>
      </div>
    </div>

    <footer>
      This project was coded by
      <a href="https://github.com/gnouy657-cell" target="_blank">Brooke Thao</a>
      and is open sourced on
      <a href="https://github.com/gnouy657-cell/AI-World-Clock" target="_blank"
        >Github</a
      >
      and hosted by
      <a href="https://ai-world-clock.onrender.com" target="_blank">Render</a>.
    </footer>

    <script src="action.js"></script>
  </body>
</html>
